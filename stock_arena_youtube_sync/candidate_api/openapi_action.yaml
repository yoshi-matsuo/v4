openapi: 3.1.0
info:
  title: STOCK ARENA Candidate Scout Data API
  version: 1.0.0
servers:
  - url: REPLACE_WITH_CLOUD_RUN_URL
paths:
  /snapshot:
    get:
      operationId: getStockArenaSnapshot
      summary: Get recent STOCK ARENA videos with performance.
      parameters:
        - name: recent_limit
          in: query
          schema: {type: integer, default: 20, minimum: 1, maximum: 50}
      responses:
        '200': {description: Latest snapshot}
  /company:
    get:
      operationId: findStockArenaCompanyHistory
      summary: Find prior coverage and performance for a company or code.
      parameters:
        - name: query
          in: query
          required: true
          schema: {type: string}
      responses:
        '200': {description: Matching prior videos}
  /recent:
    get:
      operationId: getRecentStockArenaCoverage
      summary: Get recent coverage for cooldown and theme saturation.
      parameters:
        - name: days
          in: query
          schema: {type: integer, default: 60, minimum: 1, maximum: 365}
        - name: limit
          in: query
          schema: {type: integer, default: 50, minimum: 1, maximum: 100}
      responses:
        '200': {description: Recent videos}
  /benchmarks:
    get:
      operationId: getStockArenaPerformanceBenchmarks
      summary: Get median performance benchmarks by theme and hook.
      parameters:
        - name: days
          in: query
          schema: {type: integer, default: 120, minimum: 14, maximum: 365}
      responses:
        '200': {description: Performance benchmarks}
